{% extends "base.html" %}

{% block title %}实时监控 - 校园安防智能监测系统{% endblock %}

{% block extra_css %}
<style>
    .monitor-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
    }
    .monitor-card {
        background: #1c1917 !important; /* 强制深色 */
        border: 1px solid #292524 !important;
        border-radius: var(--radius-lg);
        overflow: hidden;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
        transition: all 0.3s ease;
        color: #fafaf9 !important; /* 强制白色文字 */
    }
    .monitor-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        border-color: var(--primary-light) !important;
    }
    .monitor-header {
        background: linear-gradient(135deg, #c2410c 0%, #9a3412 100%);
        color: #fafaf9 !important;
        padding: 14px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .camera-info-bar {
        background: #0c0a09 !important; /* 极夜黑背景 */
        color: #a8a29e !important;
        padding: 6px 20px;
        font-size: 0.8rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #1c1917 !important;
    }
    .camera-info-bar .resolution {
        display: flex;
        align-items: center;
        gap: 6px;
        font-family: 'Courier New', monospace;
        color: #fb923c !important;
        font-weight: 500;
    }
    .camera-info-bar .resolution i {
        font-size: 0.75rem;
    }
    .monitor-body {
        padding: 0;
        background: #000 !important;
        min-height: 350px;
        position: relative;
    }
    .monitor-body img {
        width: 100%;
        height: 350px;
        object-fit: contain;
        background: #000 !important;
    }
    .monitor-stats {
        display: flex;
        gap: 20px;
        padding: 15px 20px;
        background: #0c0a09 !important;
        border-top: 1px solid #1c1917 !important;
        color: #fafaf9 !important;
    }
    .monitor-stats span {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 0.85rem;
        color: #a8a29e !important;
    }
    .empty-state {
        text-align: center;
        padding: 80px 20px;
        color: var(--text-muted);
        grid-column: 1 / -1;
        background: var(--card-bg);
        border-radius: var(--radius-lg);
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow-md);
        transition: all 0.3s ease;
    }
    .empty-state i {
        font-size: 5rem;
        margin-bottom: 20px;
        background: linear-gradient(135deg, var(--primary), var(--primary-light));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        opacity: 0.6;
    }
    .empty-state h5 {
        color: var(--text-main);
        font-weight: 600;
    }
    .empty-state p {
        color: var(--text-muted);
    }
    .status-badge {
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 0.8rem;
        display: flex;
        align-items: center;
        gap: 5px;
        background: rgba(16, 185, 129, 0.2) !important;
        color: #10b981 !important; /* 始终保持绿色 */
    }
    .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #10b981 !important; /* 始终保持绿色点 */
        animation: pulse 2s infinite;
    }
    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
    }
    {% if not current_user.is_authenticated %}
    .alert-info {
        background: var(--primary-subtle);
        border: none;
        border-radius: var(--radius-md);
        padding: 20px;
        color: var(--primary-dark);
    }
    .alert-info a {
        color: var(--accent);
        font-weight: 600;
    }
    {% endif %}
    @media (max-width: 768px) {
        .monitor-grid {
            grid-template-columns: 1fr;
        }
    }
</style>
{% endblock %}

{% block content %}
{% if not current_user.is_authenticated %}
<div class="alert alert-info">
    <i class="fas fa-info-circle me-2"></i>
    请 <a href="{{ url_for('auth.login') }}">登录</a> 后查看实时监控画面
</div>
{% else %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <!-- <h4 class="mb-0">
        <i class="fas fa-video me-2" style="color: var(--primary-light);"></i>实时视频监控
    </h4> -->
</div>

<div class="monitor-grid" id="monitorGrid">
    <div id="emptyState" class="empty-state">
        <i class="fas fa-server"></i>
        <h5 id="emptyStateTitle">请先连接服务器</h5>
        <p id="emptyStateDesc">前往“系统设置”连接远程服务器以获取实时监控</p>
    </div>
</div>
{% endif %}

{% block extra_js %}
<script>
    let activeCameras = new Map();
    let pollInterval = null;
    
    document.addEventListener('DOMContentLoaded', function() {
        if (!document.getElementById('monitorGrid')) return;
        
        syncCameras();
        pollInterval = setInterval(syncCameras, 10000);
        updateCameraStats();
        setInterval(updateCameraStats, 3000);
    });

    function updateCameraStats() {
        fetch('/settings/api/mqtt/camera-stats')
            .then(res => res.json())
            .then(data => {
                const cameras = data.cameras || [];
                cameras.forEach(cam => {
                    const infoBar = document.getElementById(`info-bar-${cam.id}`);
                    if (infoBar) {
                        const resText = infoBar.querySelector('.resolution-text');
                        if (resText) {
                            resText.textContent = cam.resolution;
                        }
                    }
                });
            })
            .catch(() => {});
    }

    function syncCameras() {
        fetch('/api/cameras')
            .then(response => response.json())
            .then(data => {
                const cameras = data.cameras || [];
                const mqttConnected = data.mqtt_connected;
                const emptyState = document.getElementById('emptyState');
                const emptyStateTitle = document.getElementById('emptyStateTitle');
                const emptyStateDesc = document.getElementById('emptyStateDesc');
                const monitorGrid = document.getElementById('monitorGrid');
                const intercomBar = document.querySelector('.intercom-bar');
                
                // 根据连接状态显示/隐藏对讲控制栏
                if (intercomBar) {
                    intercomBar.style.display = mqttConnected ? 'flex' : 'none';
                }
                
                if (!mqttConnected) {
                    // MQTT未连接状态
                    activeCameras.forEach(card => card.remove());
                    activeCameras.clear();
                    emptyState.style.display = 'block';
                    emptyState.querySelector('i').className = 'fas fa-server';
                    emptyStateTitle.innerText = '请先连接服务器';
                    // emptyStateDesc.innerText = '前往“系统设置”连接远程服务器以获取实时监控';
                    return;
                }

                // 追踪当前响应中的 ID
                const currentIds = new Set(cameras.map(c => c.id));

                // 1. 移除已掉线的摄像头
                for (let [id, card] of activeCameras) {
                    if (!currentIds.has(id)) {
                        card.remove();
                        activeCameras.delete(id);
                    }
                }

                // 2. 添加或更新摄像头
                if (cameras.length === 0) {
                    emptyState.style.display = 'block';
                    emptyState.querySelector('i').className = 'fas fa-video-slash';
                    emptyStateTitle.innerText = '暂无视频流';
                    emptyStateDesc.innerText = '服务器已连接，正在等待设备上线并发送心跳包数据...';
                } else {
                    emptyState.style.display = 'none';
                    
                    cameras.forEach(camera => {
                        if (!activeCameras.has(camera.id)) {
                            // 发现新上线的设备
                            const card = createCameraCard(camera.id, camera.name, camera.webrtc_url);
                            monitorGrid.appendChild(card);
                            activeCameras.set(camera.id, card);
                        } else {
                            // 如果信息有变化则更新
                            updateCameraCard(camera.id, camera.name, camera.webrtc_url);
                        }
                    });
                }
            })
            .catch(error => {
                console.error('获取摄像头列表失败:', error);
            });
    }

    function createCameraCard(id, name, webrtcUrl) {
        const card = document.createElement('div');
        card.className = 'monitor-card';
        card.id = `camera-card-${id}`;
        
        card.innerHTML = `
            <div class="monitor-header">
                <span class="camera-name"><i class="fas fa-map-marker-alt me-2"></i>${name}</span>
                <span class="status-badge status-normal">
                    <span class="status-dot"></span>activate
                </span>
            </div>
            <div class="camera-info-bar" id="info-bar-${id}">
                <span class="resolution">
                    <i class="fas fa-desktop"></i>
                    <span class="resolution-text">等待数据...</span>
                </span>
            </div>
            <div class="monitor-body">
                <div class="video-overlay" id="overlay-${id}">
                    <i class="fas fa-circle-notch fa-spin"></i>
                    <div class="x-small text-primary">正在建立安全视频链路...</div>
                </div>
                <img src="/settings/api/video/stream/${id}" data-camera-id="${id}" onerror="handleVideoError('${id}')"></img>
            </div>
            <div class="monitor-stats">
                <div class="d-flex justify-content-between w-100 align-items-center">
                    <span><i class="fas fa-video"></i> 远程视频流</span>
                </div>
            </div>
        `;
        
        // MJPEG流可能不触发onload，延迟1.5秒自动隐藏加载遮罩
        setTimeout(() => hideOverlay(id), 1500);
        
        return card;
    }

    function hideOverlay(id) {
        const overlay = document.getElementById(`overlay-${id}`);
        if (overlay) {
            overlay.classList.add('hidden');
        }
    }
    
    function handleVideoError(id) {
        console.error('视频流加载失败:', id);
    }

    function updateCameraCard(id, name, webrtcUrl) {
        const card = activeCameras.get(id);
        if (!card) return;

        const nameEl = card.querySelector('.camera-name');
        if (nameEl && nameEl.innerText !== name) {
            nameEl.innerHTML = `<i class="fas fa-map-marker-alt me-2"></i>${name}`;
        }
    }

    window.onbeforeunload = function() {
        if (pollInterval) clearInterval(pollInterval);
    };
</script>
{% endblock %}
{% endblock %}
